name: Deploy Web and Build EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-web:
    name: Deploy GitHub Pages Web Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-exe:
    name: Build Windows EXE Application
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Install Electron & Electron-Builder
        run: npm install --save-dev electron electron-builder

      - name: Package Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis -c.publish=never --config.extraMetadata.main=electron-main.cjs --config.productName="DisneyPlusClone" --config.directories.output=release

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisneyPlusClone-Windows-EXE
          path: release/*.exe
